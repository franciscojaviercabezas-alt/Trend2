name: Compilar APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Dar permisos de ejecucion a Gradle
      run: chmod +x ./TendenciasEspana2/gradlew

    - name: Compilar APK Debug
      run: |
        cd TendenciasEspana2
        ./gradlew assembleDebug

    - name: Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: TendenciasEspana2/app/build/outputs/apk/debug/app-debug.apk
